apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: lab
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://labuser:labpass@postgres-postgresql.lab.svc:5432/labdb?sslmode=disable"
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: lab
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: lab
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  postgres-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "PostgreSQL Status (Up)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "expr": "pg_up", "legendFormat": "PostgreSQL Up" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Active DB Connections",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "targets": [
            { "expr": "sum(pg_stat_activity_count)", "legendFormat": "Connections" }
          ]
        },
        {
          "type": "stat",
          "title": "Database Size (Bytes)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "targets": [
            { "expr": "pg_database_size_bytes{datname='labdb'}", "legendFormat": "labdb size" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "stat",
          "title": "Transactions Committed / sec",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "targets": [
            { "expr": "rate(pg_stat_database_xact_commit{datname='labdb'}[1m])", "legendFormat": "Commits/sec" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Transactions (Commits vs Rollbacks)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "targets": [
            { "expr": "rate(pg_stat_database_xact_commit{datname='labdb'}[1m])", "legendFormat": "Commits" },
            { "expr": "rate(pg_stat_database_xact_rollback{datname='labdb'}[1m])", "legendFormat": "Rollbacks" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Database Rows (Inserted / Updated / Deleted)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "targets": [
            { "expr": "rate(pg_stat_database_tup_inserted{datname='labdb'}[1m])", "legendFormat": "Rows Inserted" },
            { "expr": "rate(pg_stat_database_tup_updated{datname='labdb'}[1m])", "legendFormat": "Rows Updated" },
            { "expr": "rate(pg_stat_database_tup_deleted{datname='labdb'}[1m])", "legendFormat": "Rows Deleted" },
            { "expr": "rate(pg_stat_database_tup_fetched{datname='labdb'}[1m])", "legendFormat": "Rows Fetched" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["postgresql", "database", "lab"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "PostgreSQL Database Overview",
      "uid": "postgres-database-overview"
    }
